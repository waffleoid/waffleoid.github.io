<!-- Basic document settings -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUR Stand Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
:root {
  --cover: #3B2519;
  --cover-light: #54321F;
  --gold: #a67f2f;
  --gold-bright: #EFD98B;
  --ink: #3B2A1E;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 58px 20px;
  background: #1C1410;
  min-height: 100vh;
  font-family: 'EB Garamond', serif;
  color: var(--page);
}

.page-title,
.page-byline {
  display: none;
}

/* ===== The diary cover ===== */

.diary {
  max-width: 480px;
  margin: 40px auto;
  background: linear-gradient(160deg, var(--cover-light), var(--cover) 75%);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* Title panel — sized to fit its text, sits at the top */

.diary-title {
  align-self: center;
  border: 2px solid var(--gold);
  padding: 20px 80px;
  text-align: center;
}

.diary-title h1 {
  font-family: 'Playfair Display', serif;
  font-size: 1.6rem;
  color: var(--gold-bright);
  letter-spacing: 0.04em;
  margin: 0;
}

.diary-title p {
  font-family: 'EB Garamond', serif;
  font-style: italic;
  color: var(--gold);
  margin: 2px 0 0;
  font-size: 0.85rem;
}

/* Content panel — everything else lives together here */

.diary-content {
  border: 2px solid var(--gold);
  background: var(--page);
  padding: 28px 24px;
  background-image:
    repeating-linear-gradient(
      to bottom,
      transparent,
      transparent 38px,
      rgba(59, 37, 25, 0.08) 39px
    );
}

/* Arrow type toggle */

.arrow-toggle {
  display: flex;
  justify-content: center;
  gap: 0;
  margin-bottom: 16px;
  border: 1px solid var(--gold);
  width: fit-content;
  margin-left: auto;
  margin-right: auto;
}

.arrow-toggle button {
  font-family: 'Playfair Display', serif;
  font-size: 0.85rem;
  letter-spacing: 0.03em;
  background: transparent;
  color: var(--gold-bright);
  border: none;
  padding: 8px 18px;
  cursor: pointer;
}

.arrow-toggle button + button {
  border-left: 1px solid var(--gold);
}

.arrow-toggle button.active {
  background: var(--gold);
  color: var(--cover);
}
.stat-row {
  display: flex;
  justify-content: center;
  gap: 24px;
  padding-bottom: 12px;
  margin-bottom: 12px;
  border-bottom: 1px solid rgba(59, 37, 25, 0.25);
}

.cover-field {
  text-align: center;
}

.cover-field label {
  display: block;
  font-family: 'Playfair Display', serif;
  font-size: 0.8rem;
  color: var(--gold-bright);
  letter-spacing: 0.04em;
  margin-bottom: 6px;
}

.field-value {
  display: inline-flex;
  align-items: baseline;
  gap: 4px;
}

.field-value .unit {
  color: var(--gold-bright);
  font-size: 1.05rem;
}

.entry {
  font-size: 1.1rem;
  line-height: 39px;
  color: var(--gold-bright);
  margin: 0;
}

/* Inputs sitting inline in the diary text */

input {
  font-family: 'Playfair Display', serif;
  font-size: 1.1rem;
  text-align: center;
  border: none;
  border-bottom: 2px solid var(--gold-bright);
  background: transparent;
  color: var(--gold-bright);
  padding: 0 2px;
}

input:focus {
  outline: none;
  border-bottom-color: var(--gold);
  background: rgba(201, 162, 39, 0.12);
}

/* Stand / Attribute dropdowns, styled to match the inline inputs */

select {
  font-family: 'Playfair Display', serif;
  font-size: 0.95rem;
  text-align: center;
  text-align-last: center;
  border: none;
  border-bottom: 2px solid var(--gold-bright);
  background: transparent;
  color: var(--gold-bright);
  padding: 2px 4px;
  max-width: 190px;
  
}

select:focus {
  outline: none;
  border-bottom-color: var(--gold);
  background: rgba(201, 162, 39, 0.12);
}

select option {
  background: var(--cover);
  color: var(--gold-bright);
}

/* ===== Responsive ===== */

@media (max-width: 420px) {
  .stat-row {
    flex-direction: column;
    gap: 48px;
  }
  .entry {
    font-size: 1rem;
  }
}
  </style>
</head>

<!-- Basic info -->
<body>

<!-- Calculations -->
  <div class="diary">

    <!-- Title panel: sized to fit the text, sits at the top -->
    <div class="diary-title">
      <h1>SUR Stand Calculator</h1>
      <p>By waffleoid</p>
      <p>Version 1.1.1</p>
    </div>

    <!-- Content panel: everything else -->
    <div class="diary-content">

      <!-- Arrow type toggle -->
      <div class="arrow-toggle">
        <button type="button" id="regularArrowBtn" class="active">Regular Arrows</button>
        <button type="button" id="chargedArrowBtn">Charged Arrows</button>
      </div>

      <div class="stat-row">
        <div class="cover-field">
          <label for="standchance">Stand</label>
          <div class="field-value">
            <select id="standchance"></select>
          </div>
        </div>
        <div class="cover-field">
          <label for="attributechance">Attribute</label>
          <div class="field-value">
            <select id="attributechance"></select>
          </div>
        </div>
      </div>

      <p class="entry">Chance: <span id="chanceresult">X</span>% or 1 in <span id="averagearrowsresult">X</span> arrows</p>
      <p class="entry">At <input type="text" class="number" id="hourlyarrows" inputmode="numeric" value="1,000" style="width: 5ch;"> arrows/hr should spawn every <span id="averagetimeresult">X</span> hours</p>
      <p class="entry">Chance to obtain with <input type="text" class="number" id="arrowcount" inputmode="numeric" value="10,000,000" style="width: 9ch;"> arrows is <span id="obtainmentchance">X</span>%</p>
    </div>
  </div>


  <script>
    // ===== Stand / Attribute data =====
    // Each entry's "chance" is the raw percentage (e.g. 7.5 means 7.5%)

    const regularStands = [
      { name: "Silver Chariot", chance: 7.5 },
      { name: "Cream", chance: 7.5 },
      { name: "Hierophant Green", chance: 7.5 },
      { name: "Sticky Fingers", chance: 7.5 },
      { name: "Star Platinum", chance: 7.5 },
      { name: "Killer Queen", chance: 7.5 },
      { name: "Aerosmith", chance: 5 },
      { name: "Star Platinum: Stone Ocean", chance: 5 },
      { name: "Crazy Diamond", chance: 5 },
      { name: "The Emperor", chance: 5 },
      { name: "Stone Free", chance: 5 },
      { name: "The Hand", chance: 5 },
      { name: "Soft And Wet", chance: 3.75 },
      { name: "Magician's Red", chance: 3.25 },
      { name: "Purple Smoke", chance: 2.5 },
      { name: "Whitesnake", chance: 2.5 },
      { name: "Diver Down", chance: 2.5 },
      { name: "The World", chance: 2 },
      { name: "Weather Report", chance: 1.5 },
      { name: "Gold Experience", chance: 1 },
      { name: "King Crimson", chance: 1 },
      { name: "D4C", chance: 1 },
      { name: "Premier Macho", chance: 1 },
      { name: "Silver Chariot OVA", chance: 0.3 },
      { name: "Hierophant Green OVA", chance: 0.3 },
      { name: "Magician's Red OVA", chance: 0.3 },
      { name: "The World OVA", chance: 0.1 },
      { name: "Star Platinum OVA", chance: 0.05 },
      { name: "Sun", chance: 0.000333333},
      { name: "IBM", chance: 0.000333333}
    ];

    const chargedStands = [
      { name: "Silver Chariot", chance: 15 },
      { name: "Crazy Diamond", chance: 15 },
      { name: "Star Platinum", chance: 10 },
      { name: "Hierophant Green", chance: 10 },
      { name: "Killer Queen", chance: 10 },
      { name: "The Hand", chance: 10 },
      { name: "Golden Experience", chance: 5 },
      { name: "King Crimson", chance: 5 },
      { name: "Tusk Act 1", chance: 5 },
      { name: "The World", chance: 5 },
      { name: "D4C", chance: 5 },
      { name: "Whitesnake", chance: 4.9 },
      { name: "The World: Alternate Universe", chance: 2 },
      { name: "Vanilla Ice's Cream", chance: 0.5 },
      { name: "DIO's The World", chance: 0.1 },
      { name: "Jotaro's Star Platinum", chance: 0.1 },
      { name: "Sunlit Crusader", chance: 0.015 },
      { name: "Universal Remnant", chance: 0.015 }
    ];

    const attributes = [
      { name: "Any", chance: 100 },
      { name: "None", chance: 49.77 },
      { name: "Strong", chance: 9.93 },
      { name: "Tough", chance: 9 },
      { name: "Sloppy", chance: 7 },
      { name: "Powerful", chance: 5 },
      { name: "Manic", chance: 5 },
      { name: "Enrage", chance: 5 },
      { name: "Lethargic", chance: 4.79 },
      { name: "Godly", chance: 3 },
      { name: "Daemon", chance: 1 },
      { name: "Glass Cannon", chance: 0.25 },
      { name: "Invincible", chance: 0.1 },
      { name: "Tragic", chance: 0.1 },
      { name: "Hacker", chance: 0.06 },
      { name: "Scourge", chance: 0.04 },
      { name: "Legendary", chance: 0.01 }
    ];

 // ===== Populate a <select> from a data array =====
    function populateSelect(selectEl, data) {
      selectEl.innerHTML = '';
      data.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.chance;
        opt.dataset.name = item.name;
        opt.textContent = `${item.name} (${item.chance}%)`;
        selectEl.appendChild(opt);
      });
    }

 const standSelect = document.getElementById('standchance');
    const attributeSelect = document.getElementById('attributechance');

    // ===== Shrink a select's font only if the selected text overflows =====
    const measureCanvas = document.createElement('canvas');
    const measureCtx = measureCanvas.getContext('2d');

    function fitSelectText(selectEl) {
      const baseSize = 15.2; // matches 0.95rem at a 16px root
      const minSize = 9;

      selectEl.style.fontSize = baseSize + 'px';

      const text = selectEl.options[selectEl.selectedIndex]
        ? selectEl.options[selectEl.selectedIndex].textContent
        : '';

      const style = getComputedStyle(selectEl);
      const available = selectEl.clientWidth - 12;

      let size = baseSize;
      measureCtx.font = `${style.fontWeight} ${size}px ${style.fontFamily}`;

      while (measureCtx.measureText(text).width > available && size > minSize) {
        size -= 0.5;
        measureCtx.font = `${style.fontWeight} ${size}px ${style.fontFamily}`;
      }

      selectEl.style.fontSize = size + 'px';
    }

    function fitBothSelects() {
      fitSelectText(standSelect);
      fitSelectText(attributeSelect);
    }

    // Remembers the last Stand picked under each arrow type independently
        // Remembers the last Stand picked under each arrow type independently
    let currentArrowType = 'regular';
    const lastStandByType = { regular: null, charged: null };

    function selectByName(selectEl, name) {
      const match = [...selectEl.options].find(o => o.dataset.name === name);
      if (match) selectEl.selectedIndex = match.index;
    }

    populateSelect(standSelect, regularStands);
    populateSelect(attributeSelect, attributes);

    // ===== Default selection on page load =====
    selectByName(standSelect, "The World OVA");
    selectByName(attributeSelect, "Legendary");
    lastStandByType.regular = "The World OVA";

    fitBothSelects();
    standSelect.addEventListener('change', () => {
      lastStandByType[currentArrowType] = standSelect.options[standSelect.selectedIndex].dataset.name;
      fitSelectText(standSelect);
      calculate();
    });
    attributeSelect.addEventListener('change', () => {
      fitSelectText(attributeSelect);
      calculate();
    });

    // ===== Arrow type toggle =====
    const regularBtn = document.getElementById('regularArrowBtn');
    const chargedBtn = document.getElementById('chargedArrowBtn');

    regularBtn.addEventListener('click', () => {
      regularBtn.classList.add('active');
      chargedBtn.classList.remove('active');
      currentArrowType = 'regular';
      populateSelect(standSelect, regularStands);

      const remembered = lastStandByType.regular;
      if (remembered) {
        const match = [...standSelect.options].find(o => o.dataset.name === remembered);
        if (match) standSelect.selectedIndex = match.index;
      }

      fitSelectText(standSelect);
      calculate();
    });

    chargedBtn.addEventListener('click', () => {
      chargedBtn.classList.add('active');
      regularBtn.classList.remove('active');
      currentArrowType = 'charged';
      populateSelect(standSelect, chargedStands);

      const remembered = lastStandByType.charged;
      if (remembered) {
        const match = [...standSelect.options].find(o => o.dataset.name === remembered);
        if (match) standSelect.selectedIndex = match.index;
      }

      fitSelectText(standSelect);
      calculate();
    });

    <!-- Arrow count input -->
    const arrowInput = document.getElementById('arrowcount');
    function getArrowCount() {
      return Number(arrowInput.value.replace(/\D/g, '')) || 0;
    }

    arrowInput.addEventListener('input', () => {
      const caret = arrowInput.selectionStart;
      const digitsBefore = arrowInput.value.slice(0, caret).replace(/\D/g, '').length;

      <!-- Remove everything but the digits -->
      let digits = arrowInput.value.replace(/\D/g, '').replace(/^0+(?=\d)/, '');
      arrowInput.value = digits ? Number(digits).toLocaleString('en-US') : '';

      let pos = 0, seen = 0;
      while (pos < arrowInput.value.length && seen < digitsBefore) {
        if (/\d/.test(arrowInput.value[pos])) seen++;
        pos++;
      }
      arrowInput.setSelectionRange(pos, pos);

      calculate();
    });
    const hourlyInput = document.getElementById('hourlyarrows');

function getHourlyArrows() {
  return Number(hourlyInput.value.replace(/\D/g, '')) || 0;
}

hourlyInput.addEventListener('input', () => {
  const caret = hourlyInput.selectionStart;
  const digitsBefore = hourlyInput.value.slice(0, caret).replace(/\D/g, '').length;

  let digits = hourlyInput.value.replace(/\D/g, '').replace(/^0+(?=\d)/, '');
  hourlyInput.value = digits ? Number(digits).toLocaleString('en-US') : '';

  let pos = 0, seen = 0;
  while (pos < hourlyInput.value.length && seen < digitsBefore) {
    if (/\d/.test(hourlyInput.value[pos])) seen++;
    pos++;
  }
  hourlyInput.setSelectionRange(pos, pos);

  calculate();
});

    <!-- Main calculation -->
    function calculate() {
      const num1 = (parseFloat(document.getElementById("standchance").value) || 0) / 100;
      const num2 = (parseFloat(document.getElementById("attributechance").value) || 0) / 100;
      const chancePerArrow = num1 * num2;

      // No 0% results
      if (chancePerArrow <= 0) {
        document.getElementById("chanceresult").innerText = "0";
        document.getElementById("averagearrowsresult").innerText = "∞";
        document.getElementById("averagetimeresult").innerText = "∞";
        document.getElementById("obtainmentchance").innerText = "0";
        return;
      }
      <!-- Combined chance of arrows, handling float point -->
      document.getElementById("chanceresult").innerText =
        (chancePerArrow * 100).toFixed(12).replace(/\.?0+$/, '');

      <!-- Calculating expected number of arrows for one success -->
      const averagearrowtotal = Math.round(1 / chancePerArrow);
      document.getElementById("averagearrowsresult").innerText =
        averagearrowtotal.toLocaleString();

      <!-- Real-world time to use that many arrows -->
      const hourly = getHourlyArrows();
      document.getElementById("averagetimeresult").innerText = hourly > 0
        ? (averagearrowtotal / hourly).toLocaleString(undefined, { maximumFractionDigits: 2 })
        : "∞";

      <!-- Chance of obtaining within X amount of arrows -->
      const obtainmentchance = 1 - Math.pow(1 - chancePerArrow, getArrowCount());
      document.getElementById("obtainmentchance").innerText =
        (obtainmentchance * 100).toFixed(6).replace(/\.?0+$/, '');
    }

    calculate();
  </script>
</body>
</html>
